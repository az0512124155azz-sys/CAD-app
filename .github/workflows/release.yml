name: Build Installers

# Builds real native installers (.exe / .msi, .dmg, .AppImage / .deb)
# for Windows, macOS and Linux, and attaches them to a GitHub Release.
#
# How to trigger:
#   * Push a tag that starts with "v", e.g.  git tag v0.1.0 && git push origin v0.1.0
#   * Or run it manually from the GitHub "Actions" tab (workflow_dispatch).

on:
  push:
    # Pushing a v* tag creates a public Release with the installers.
    tags:
      - "v*"
    # Pushing to the development branch builds installers and uploads them
    # as downloadable workflow artifacts (no release needed).
    branches:
      - "claude/chrome-ai-screen-control-2o2ttt"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS build targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: ai-screen-control
        run: npm install

      - name: Generate application icons
        working-directory: ai-screen-control
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build the app (and release on tags)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ai-screen-control
          # Only create a GitHub Release when triggered by a version tag or a
          # manual dispatch. On a plain branch push, tagName is empty so the
          # action just builds and we upload the installers as artifacts below.
          tagName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: "AI Screen Control ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## AI Screen Control — Installers

            Download the installer for your operating system below, then run it:

            * **Windows** — `.msi` or `.exe` (setup)
            * **macOS** — `.dmg` (drag to Applications)
            * **Linux** — `.AppImage` (make executable and run) or `.deb`

            After installing, open the app, click Settings, and paste your AI API key.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # Grab every built installer, whichever target dir it landed in.
          path: |
            ai-screen-control/src-tauri/target/**/release/bundle/**/*.dmg
            ai-screen-control/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            ai-screen-control/src-tauri/target/release/bundle/**/*.msi
            ai-screen-control/src-tauri/target/release/bundle/**/*.exe
            ai-screen-control/src-tauri/target/release/bundle/**/*.AppImage
            ai-screen-control/src-tauri/target/release/bundle/**/*.deb
            ai-screen-control/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn
